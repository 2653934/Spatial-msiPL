# Main environment: training, IG, scoring, summaries and figures (the versions used for
# the paper's results). statsmodels is needed only for the descriptive mixed models in
# scripts/compute_statistics_6_6.py.
name: spatial_msipl
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.5
  - pytorch=2.3.0
  - pytorch-cuda=12.1
  - numpy=2.4.6
  - scipy=1.18.1
  - scikit-learn=1.9.0
  - h5py=3.16.0
  - matplotlib=3.11.2
  - pandas=3.0.5
  - statsmodels=0.15.0
  - tqdm
  - pip
  - pip:
      - m2aia==0.5.10
      - pyimzml==1.5.5
